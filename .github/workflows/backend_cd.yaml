name: BACKEND - Deploy to Amazon ECS

on:
  # workflow_run: reacts to another workflow
  workflow_run:
    workflows: ["BACKEND - Build and Push to Amazon ECR"]
    types:
      - completed

  # workflow_dispatch: started on demands - e.g. manual triggering of the pipeline
  workflow_dispatch:



# permission can be added at job level or workflow level
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout


# removes concurency i.e. only one pipeline containing this group can run at any given time
concurrency:
  group: ecs-project
  cancel-in-progress: false

# - preventing two ECS deployments from overlapping on the same service
# - prevent this from canelling a pipeline mid apply if it's already running


env:
  AWS_REGION: eu-west-1                         # set this to your preferred AWS region, e.g. us-west-1
  ECR_REPOSITORY: ecs-project                   # set this to your Amazon ECR repository name
  ECS_SERVICE: ecs-project-sandbox              # set this to your Amazon ECS service name
  ECS_CLUSTER: ecs-project-sandbox              # set this to your Amazon ECS cluster name
  ECS_TASK_FAMILY: ecs-project-sandbox          # family to fetch the current revision from AWS
  ECS_TASK_DEF_FILE: task-definition.clean.json # workspace-relative file the render step reads
  CONTAINER_NAME: "backend"                     # set this to the name of the container in the
                                                # containerDefinitions section of your task definition

jobs:
  deploy:
    # Only deploy when triggered manually, or when the triggering CI run succeeded on main.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./assessement/8-simplified-ecs/app

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d
        with:
          role-to-assume: arn:aws:iam::171109859843:role/oidc-role-ecs-managed-bootstrap
          role-session-name: ecs-oidc
          aws-region: "eu-west-1"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@62f4f872db3836360b72999f4b87f1ff13310f3a

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-definition.json > "$GITHUB_WORKSPACE/$ECS_TASK_DEF_FILE"

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@c804dfbdd57f713b6c079302a4c01db7017a36fc
        with:
          task-definition: ${{ env.ECS_TASK_DEF_FILE }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f169e64a0e60233aacca83799a
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
