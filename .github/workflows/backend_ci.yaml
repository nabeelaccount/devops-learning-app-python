name: BACKEND - Build and Push to Amazon ECR

on:
  push:
    paths:
      - 'backend/**'

    branches:
      - main

  workflow_dispatch:  # Enable pipeline can be manual triggering of the pipeline


  # - permission can be added at job level or workflow level
permissions:
  id-token: write     # This is required for requesting the JWT
  contents: read      # This is required for actions/checkout


env:
  AWS_REGION: eu-west-1                         # set this to your preferred AWS region, e.g. us-west-1
  ECR_REPOSITORY: ecs-project                   # set this to your Amazon ECR repository name

jobs:
  build:
    if: github.ref == 'refs/heads/main'         # Ensure job runs only when main branch is updated as required by the OIDC role.
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d
        with:
          role-to-assume: arn:aws:iam::171109859843:role/oidc-role-ecs-managed-bootstrap
          role-session-name: ecs-oidc
          aws-region: "eu-west-1"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@62f4f872db3836360b72999f4b87f1ff13310f3a

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build a docker container and
          # push it to ECR so that it can
          # be deployed to ECS.
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT