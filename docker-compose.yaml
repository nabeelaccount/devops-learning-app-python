services:
  backend:
    build: ./backend
    environment:
      # pass SECURE_PASSWORD from .env or fail if it is missing
      - SECURE_PASSWORD=${SECURE_PASSWORD:?SECURE_PASSWORD is not set}
    volumes:
      # /data as specified by DATA_DIR in the application.
      - backend-data:/data
    healthcheck:
      # call /health from inside the container
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      # host 8080 -> container 80
      - "${APP_PORT:-8080}:80"
    depends_on:
      # wait for backend to be healthy, not just started
      backend:
        condition: service_healthy

volumes:
  backend-data: