# TARGET GROUPS

upstream backend_app {
    server backend:8080;
}

server {
    # WHICH PORT NGINX TO LISTEN/RECEIVE ON

    listen 80;


    # root      = specifies the base directory to look
    # index     = specify default file to servce

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }


    # PATHS AND HEADERS
    # - proxy_pass          = backend target (group)
    # - Host $host          = forwards from api.example.com --> localhost:3000 (backend)
    # - X-Real-IP           = forwards the IP of the client connecting
    # - X-Forwarded-For     = forwards all the IP address proxied through e.g. Client -> Cloudflare -> Nginx -> App
    # - X-Forwarded-Proto   = tells backend if the original request was HTTP or HTTPS
    # - X-Request-Id        = forwards X-Request-Id request ID as request_id


    location /api/ {
        proxy_pass http://backend_app/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }
}
